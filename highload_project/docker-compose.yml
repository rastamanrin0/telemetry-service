version: "3.9"

services:
  elasticsearch:
    image: elasticsearch:8.11.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: telemetry-platform
    depends_on:
      elasticsearch:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      - SERVER_ADDRESS=:8080
      - ELASTIC_URL=http://elasticsearch:9200
      - CLICKHOUSE_ADDRS=clickhouse:9000
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - LOGS_RETENTION_DURATION=720h
      - METRICS_RETENTION_DURATION=168h
      - RETENTION_CHECK_INTERVAL=1h
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  esdata:
  chdata:
